# graphql schema


type Product {
    id: ID!
    name: String!
    price: Float!
}

type User {
    id: ID!
    name: String!
    email: String!
    orders: [Order]
}

type Order {
    id: ID!
    date: String!
    products: [Product]
    totalAmount: Float!
}

type Query {
    users: [User!]!
    products: [Product!]!
    orders: [Order!]!
}

type Mutation {
    createUser(name: String!, email: String!): User!
    createProduct(name: String!, price: Float!): Product!
    createOrder(userId: ID!, productIds: [ID!]!, date: String!): Order!
}